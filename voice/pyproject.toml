[project]
name = "immigration-voice-agent"
version = "0.1.0"
description = "Real-time voice agent for US immigration questions"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[google,silero,webrtc]>=1.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "websockets>=16.1.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anthropic[vertex]>=1.7.0",
    "pytest>=9.1.1",
]
