[project]
name = "immigration-assistant"
version = "0.2.0"
description = "Text-first US immigration assistant with browser speech-to-text"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "openai>=1.60",
    "pyyaml>=6.0.3",
    # Corpus builds: fam.state.gov serves an incomplete certificate chain, so
    # verification is delegated to the OS trust store (see ingest/fam.py).
    "truststore>=0.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]
